name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter todo exec playwright install --with-deps chromium
      - run: pnpm ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            apps/*/.vitest-attachments/
            apps/*/.vitest-browser/
            apps/*/src/**/__traces__/
          include-hidden-files: true
          if-no-files-found: ignore
