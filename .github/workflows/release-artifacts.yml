name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package:artifacts
      - run: pnpm --filter wavex-vscode package
      - uses: actions/upload-artifact@v7
        with:
          name: wavex-${{ github.sha }}
          path: |
            artifacts/*.tgz
            editors/vscode/*.vsix
          if-no-files-found: error
